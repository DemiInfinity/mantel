name: Idea or feature
description: Suggest something Mantel could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like your AIs (or you) to be able to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. Any ideas on how it might look or work.
  - type: checkboxes
    id: rules
    attributes:
      label: Mantel's design rules
      options:
        - label: This keeps the board read-only for the home and append-only.
